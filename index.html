<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scraped Contacts Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 2rem; background: var(--bg); color: var(--text); }
    .container { max-width: 1000px; margin: 0 auto; }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      align-items: center; gap: 1rem; margin-bottom: 1.5rem;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .meta { color: var(--muted); font-size: 0.875rem; margin-top: 0.25rem; }
    .controls { display: flex; gap: 0.75rem; align-items: center; }
    input[type="search"] {
      padding: 0.6rem 0.9rem; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); min-width: 240px;
    }
    button {
      padding: 0.6rem 1.1rem; border: none; border-radius: 6px;
      background: var(--accent); color: white; font-weight: 600; cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .table-wrap {
      overflow-x: auto; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    tr:last-child td { border-bottom: none; }
    a { color: #60a5fa; text-decoration: none; }
    .empty { text-align: center; padding: 2rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Scraped Contacts</h1>
        <div class="meta" id="metaInfo">Loading data...</div>
      </div>
      <div class="controls">
        <input type="search" id="searchInput" placeholder="Filter by name, email, phone..." />
        <button id="downloadCsvBtn" disabled>Download CSV</button>
      </div>
    </header>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Source</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="4" class="empty">Loading records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let allContacts = [];
    let filteredContacts = [];

    const tableBody = document.getElementById("tableBody");
    const metaInfo = document.getElementById("metaInfo");
    const searchInput = document.getElementById("searchInput");
    const downloadBtn = document.getElementById("downloadCsvBtn");

    async function loadData() {
      try {
        // Cache-buster ensures CDN/browser always pulls the latest commit
        const res = await fetch(`./data.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        allContacts = data.contacts || [];
        filteredContacts = [...allContacts];

        const updated = data.last_updated
          ? new Date(data.last_updated).toLocaleString()
          : "Unknown";
        metaInfo.textContent = `${allContacts.length} records • Last updated: ${updated}`;
        downloadBtn.disabled = allContacts.length === 0;

        renderTable(filteredContacts);
      } catch (err) {
        metaInfo.textContent = "Could not load data.json (run the scraper workflow first).";
        tableBody.innerHTML = `<tr><td colspan="4" class="empty">No data available yet.</td></tr>`;
      }
    }

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderTable(rows) {
      if (!rows.length) {
        tableBody.innerHTML = `<tr><td colspan="4" class="empty">No matching contacts found.</td></tr>`;
        return;
      }
      tableBody.innerHTML = rows.map(c => `
        <tr>
          <td>${escapeHtml(c.name)}</td>
          <td>${escapeHtml(c.email)}</td>
          <td>${escapeHtml(c.phone)}</td>
          <td><a href="${escapeHtml(c.source)}" target="_blank" rel="noopener">Link</a></td>
        </tr>
      `).join("");
    }

    function toCsvValue(val = "") {
      const str = String(val).replace(/"/g, '""');
      return `"${str}"`;
    }

    function downloadCsv() {
      const headers = ["Name", "Email", "Phone", "Source"];
      const lines = [
        headers.join(","),
        ...filteredContacts.map(c =>
          [c.name, c.email, c.phone, c.source].map(toCsvValue).join(",")
        )
      ];
      const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `contacts_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      filteredContacts = allContacts.filter(c =>
        `${c.name} ${c.email} ${c.phone}`.toLowerCase().includes(q)
      );
      renderTable(filteredContacts);
    });

    downloadBtn.addEventListener("click", downloadCsv);
    loadData();
  </script>
</body>
</html>
