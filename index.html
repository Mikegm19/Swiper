<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scraper Bot Dashboard</title>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6; --accent-hover: #2563eb;
      --term-bg: #020617; --green: #4ade80; --amber: #fbbf24; --red: #f87171; --cyan: #38bdf8;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 2rem; background: var(--bg); color: var(--text); }
    .container { max-width: 1050px; margin: 0 auto; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem;
    }
    .input-row { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    input {
      flex: 1; min-width: 240px; padding: 0.65rem 0.9rem; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
    button {
      padding: 0.65rem 1.2rem; border: none; border-radius: 6px;
      background: var(--accent); color: white; font-weight: 600; cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem; }
    .meta { color: var(--muted); font-size: 0.875rem; }

    /* Live Terminal Console */
    .terminal {
      margin-top: 1rem; background: var(--term-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.85rem 1rem; height: 155px; overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.82rem;
      line-height: 1.55;
    }
    .log-line { display: flex; gap: 0.5rem; animation: fadeIn 0.2s ease-out; }
    .log-time { color: #64748b; user-select: none; }
    .log-info { color: var(--cyan); }
    .log-ok { color: var(--green); }
    .log-warn { color: var(--amber); }
    .log-err { color: var(--red); }
    .cursor {
      display: inline-block; width: 7px; height: 13px; background: var(--green);
      vertical-align: middle; margin-left: 4px; animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    a { color: #60a5fa; text-decoration: none; }
    .empty { text-align: center; padding: 2rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Scraper Bot Dashboard</h1>

    <!-- Frontend Trigger Panel -->
    <div class="panel">
      <div class="input-row">
        <input type="url" id="targetUrl" placeholder="Enter Target URL (https://example.com/team)" />
        <button id="runBotBtn">Run Bot on URL</button>
      </div>
      <div class="terminal" id="terminal"></div>
    </div>

    <!-- Data Controls -->
    <div class="row" style="margin-bottom: 1rem;">
      <div class="meta" id="metaInfo">Loading data...</div>
      <div class="row">
        <input type="search" id="searchInput" placeholder="Filter results..." style="flex: none; width: 220px;" />
        <button id="downloadCsvBtn" disabled>Download CSV</button>
      </div>
    </div>

    <!-- Results Table -->
    <div class="panel" style="padding: 0; overflow-x: auto;">
      <table>
        <thead>
          <tr><th>Name</th><th>Email</th><th>Phone</th><th>Source</th></tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="4" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let allContacts = [];
    let filteredContacts = [];
    let lastTimestamp = null;
    let pollTimer = null;
    let stageTimers = [];
    let pollCount = 0;

    const targetUrlEl = document.getElementById("targetUrl");
    const runBotBtn = document.getElementById("runBotBtn");
    const terminalEl = document.getElementById("terminal");
    const metaInfo = document.getElementById("metaInfo");
    const tableBody = document.getElementById("tableBody");
    const searchInput = document.getElementById("searchInput");
    const downloadBtn = document.getElementById("downloadCsvBtn");

    function log(msg, type = "info", showCursor = false) {
      // Remove blinking cursor from previous line
      const oldCursor = terminalEl.querySelector(".cursor");
      if (oldCursor) oldCursor.remove();

      const time = new Date().toLocaleTimeString([], { hour12: false });
      const line = document.createElement("div");
      line.className = "log-line";
      line.innerHTML = `<span class="log-time">[${time}]</span><span class="log-${type}">${escapeHtml(msg)}${showCursor ? '<span class="cursor"></span>' : ""}</span>`;
      terminalEl.appendChild(line);
      terminalEl.scrollTop = terminalEl.scrollHeight;
    }

    function clearStageTimers() {
      stageTimers.forEach(clearTimeout);
      stageTimers = [];
    }

    async function loadData(isPoll = false) {
      try {
        const res = await fetch(`./data.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        const isNew = lastTimestamp && data.last_updated !== lastTimestamp;
        lastTimestamp = data.last_updated;

        allContacts = data.contacts || [];
        filteredContacts = [...allContacts];

        const updated = data.last_updated ? new Date(data.last_updated).toLocaleString() : "Unknown";
        metaInfo.textContent = `${allContacts.length} records • Last updated: ${updated}`;
        downloadBtn.disabled = allContacts.length === 0;
        renderTable(filteredContacts);

        if (isNew && pollTimer) {
          clearInterval(pollTimer);
          clearStageTimers();
          pollTimer = null;
          log(`SUCCESS: Fresh data.json received (${allContacts.length} contacts). Table updated.`, "ok");
          runBotBtn.disabled = false;
        } else if (isPoll) {
          pollCount++;
          log(`Polling Vercel CDN for updated data.json (check #${pollCount})...`, "warn", true);
        }
      } catch {
        if (!isPoll) {
          metaInfo.textContent = "No data.json found yet. Run the bot to generate it.";
          tableBody.innerHTML = `<tr><td colspan="4" class="empty">No data available yet.</td></tr>`;
          log("Ready. No data.json detected yet—enter a URL above to start.", "warn");
        }
      }
    }

    async function triggerBot() {
      const url = targetUrlEl.value.trim();
      if (!url) {
        log("ERROR: Please enter a valid URL first.", "err");
        return;
      }

      runBotBtn.disabled = true;
      pollCount = 0;
      clearStageTimers();
      if (pollTimer) clearInterval(pollTimer);

      log(`Initializing scrape job for: ${url}`, "info", true);

      try {
        const res = await fetch("/api/scrape", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });

        const result = await res.json();
        if (!res.ok) throw new Error(result.error || `HTTP ${res.status}`);

        log("Vercel backend authenticated & dispatched GitHub Action.", "ok", true);

        // Staged pipeline feed while GitHub Actions + Vercel execute
        const stages = [
          [4000, "Spinning up Ubuntu runner in GitHub Actions...", "info"],
          [12000, "Booting headless Playwright Chromium browser...", "info"],
          [22000, "Applying anti-ban jitter & navigating to target URL...", "info"],
          [34000, "Scrolling page & extracting linked names, emails, and phones...", "info"],
          [48000, "Committing data.json & waiting for Vercel CDN rebuild...", "warn"],
        ];

        stages.forEach(([delay, text, type]) => {
          stageTimers.push(setTimeout(() => {
            if (pollTimer) log(text, type, true);
          }, delay));
        });

        pollTimer = setInterval(() => loadData(true), 10000);
      } catch (err) {
        log(`ERROR: ${err.message}`, "err");
        runBotBtn.disabled = false;
      }
    }

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderTable(rows) {
      if (!rows.length) {
        tableBody.innerHTML = `<tr><td colspan="4" class="empty">No matching contacts.</td></tr>`;
        return;
      }
      tableBody.innerHTML = rows.map(c => `
        <tr>
          <td>${escapeHtml(c.name)}</td>
          <td>${escapeHtml(c.email)}</td>
          <td>${escapeHtml(c.phone)}</td>
          <td><a href="${escapeHtml(c.source)}" target="_blank" rel="noopener">Link</a></td>
        </tr>
      `).join("");
    }

    function downloadCsv() {
      const headers = ["Name", "Email", "Phone", "Source"];
      const esc = v => `"${String(v || "").replace(/"/g, '""')}"`;
      const lines = [
        headers.join(","),
        ...filteredContacts.map(c => [c.name, c.email, c.phone, c.source].map(esc).join(","))
      ];
      const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `contacts_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      log(`Exported ${filteredContacts.length} contacts to CSV.`, "ok");
    }

    searchInput.addEventListener("input", e => {
      const q = e.target.value.toLowerCase().trim();
      filteredContacts = allContacts.filter(c =>
        `${c.name} ${c.email} ${c.phone}`.toLowerCase().includes(q)
      );
      renderTable(filteredContacts);
    });

    runBotBtn.addEventListener("click", triggerBot);
    downloadBtn.addEventListener("click", downloadCsv);

    log("System online. Loading cached data.json...", "info");
    loadData();
  </script>
</body>
</html>
