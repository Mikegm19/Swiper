name: Playwright Scraper Bot

on:
  schedule:
    # Runs every 6 hours at minute 17
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scrape (leave blank to use targets.csv)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scraper-requirements.txt"

      - name: Install Python dependencies
        run: pip install -r scraper-requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run scraper bot
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        run: python scraper.py

      - name: Commit and push updated data files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors data.json contacts_export.csv
          git diff --staged --quiet || (git commit -m "chore: update bulk scraped data" && git push)
